# ABOUTME: Tests the shared tooling on every push — shell syntax, shellcheck, the hook guards, the reusable workflows
# ABOUTME: Everything here is offline: no token, no network, no repo state touched
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax of every shell script
        run: |
          set -euo pipefail
          find . -path ./vendor -prune -o -name '*.sh' -print0 | xargs -0 -n1 bash -n
          for f in hooks/pre-commit hooks/commit-msg hooks/pre-push; do bash -n "$f"; done
      - name: shellcheck the hooks
        run: shellcheck -x -S warning hooks/pre-commit hooks/commit-msg hooks/pre-push hooks/ai-attribution.sh hooks/test-attribution.sh
      - name: pre-commit submodule guard
        run: bash hooks/test-pre-commit.sh
      - name: AI attribution guards (commit-msg, pre-push)
        run: bash hooks/test-attribution.sh

  # release-crate.yml and notify-release.yml are called at @main by every satellite's
  # release, so a broken expression or script here breaks thirteen releases at once.
  # actionlint checks the workflow syntax, the expressions and, through shellcheck,
  # every run: block.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: actionlint every workflow
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
