# ABOUTME: Tests the shared tooling on every push — shell syntax, shellcheck, the hook guards, the worktree skills, the satellite gate, the reusable workflows
# ABOUTME: No token and no repo state touched; only the toolchain and ripgrep installs reach the network
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax of every shell script
        run: |
          set -euo pipefail
          find . -path ./vendor -prune -o -name '*.sh' -print0 | xargs -0 -n1 bash -n
          for f in hooks/pre-commit hooks/commit-msg hooks/pre-push; do bash -n "$f"; done
      - name: shellcheck the hooks
        run: shellcheck -x -S warning hooks/pre-commit hooks/commit-msg hooks/pre-push hooks/ai-attribution.sh hooks/test-attribution.sh
      - name: pre-commit submodule guard
        run: bash hooks/test-pre-commit.sh
      - name: AI attribution guards (commit-msg, pre-push)
        run: bash hooks/test-attribution.sh
      # Every consumer runs these through its .claude/skills links, so a refusal that
      # stops firing here stops firing in all of them.
      - name: shellcheck the shared skills and the bootstrap
        run: |
          shellcheck -x -S warning ci/bootstrap-repo.sh skills/lib/worktree.sh \
            skills/create-worktree/create-worktree.sh skills/finish-worktree/finish-worktree.sh \
            skills/finish-worktree/merge-and-cleanup.sh skills/finish-worktree/prune-stale-branches.sh \
            skills/test-worktree-skills.sh
      - name: worktree skills (create, finish, merge-and-cleanup, prune)
        run: bash skills/test-worktree-skills.sh

  # Every satellite's pre-push gate is validation/satellite-pre-push-validate.sh, so a
  # tier that stops firing here stops firing in all of them. The test builds a
  # dependency-free crate on the toolchain the satellites pin.
  satellite-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - name: shellcheck the gate and its test
        run: shellcheck -x -S warning validation/satellite-pre-push-validate.sh validation/test-satellite-pre-push-validate.sh
      - name: satellite pre-push gate
        run: bash validation/test-satellite-pre-push-validate.sh

  # validate.sh is every consumer's shared text scan, and its unwrap/expect/panic,
  # mock and underscore counts skip a trailing #[cfg(test)] module through
  # test-module-lines.sh. The test drives the filter, its layout check, and
  # validate.sh itself on fixture repos, so a scan that starts counting test code
  # (or stops counting production code) fails here before it reaches a consumer.
  validation-scans:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - name: shellcheck the filter and its test
        run: shellcheck -x -S warning validation/test-module-lines.sh validation/test-test-module-lines.sh
      - name: test-module filter and validate.sh scans
        run: bash validation/test-test-module-lines.sh

  # release-crate.yml and notify-release.yml are called at @main by every satellite's
  # release, so a broken expression or script here breaks thirteen releases at once.
  # actionlint checks the workflow syntax, the expressions and, through shellcheck,
  # every run: block.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: actionlint every workflow
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
